name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Prisma may read DATABASE_URL during its install-time client generation.
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build the app
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-only-placeholder-secret

      # Build, but do not publish, the production image on every change.
      - name: Build Docker image
        run: docker build --tag velora:ci .
